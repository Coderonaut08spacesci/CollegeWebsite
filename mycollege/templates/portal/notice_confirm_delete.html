{% extends 'base.html' %}

{% block title %}Confirm Delete{% endblock %}

{% block content %}
<div class="alert alert-danger shadow-sm text-center">
    <h4>Are you sure you want to delete this notice?</h4>
    <p class="lead">"<strong>{{ object.title }}</strong>"</p>
    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'notice-detail' object.pk %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
